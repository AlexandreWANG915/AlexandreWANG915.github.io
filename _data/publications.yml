published:
  - title: "A Survey of the OpenClaw Ecosystem: From Platform Extensibility to Constraint Design"
    id: openclaw-survey
    authors: <strong>Ziqing Wang</strong>, Qijie Zhu, Yu Xiao, Marcelina A. Przespolewska, Erik C. Nisbet, Han Liu, Kaize Ding
    conference_short: TMLR
    conference: Transactions on Machine Learning Research <strong>(TMLR)</strong>, 2026.
    year: 2026
    pdf: https://github.com/REAL-Lab-NU/Awesome-OpenClaw-Papers/blob/main/OpenClaw_Survey.pdf
    code: https://github.com/REAL-Lab-NU/Awesome-OpenClaw-Papers
    image: ./assets/img/OpenClaw.png
    tags: ["Agentic AI / LLMs"]
    abstract: >-
      Large language models have evolved into autonomous agents capable of invoking tools, using memory, and taking actions in real-world environments. Yet despite this progress, many agent systems remain difficult for ordinary users to adopt directly. OpenClaw, an open-source and self-hosted agent platform, addresses this gap through a local-first, messaging-native, and skill-extensible design that connects everyday messaging applications to LLM-powered agents. This design makes OpenClaw one of the first open personal-agent ecosystems, with ClawHub for shared Skills, Heartbeat for proactive background turns, and Moltbook as an agent-only social network. We survey this emerging ecosystem and show that the literature repeatedly highlights the same tradeoff: the openness that makes OpenClaw extensible also creates new governance, security, social, and deployment challenges. We organize the survey around four dimensions that trace this tradeoff from platform design to its ecosystem-level consequences: Platform, where open Skills enable rapid capability growth but create new governance problems; Security, where open Tools, Skills, Memory, and background execution expand the attack surface; Societies, where Moltbook reveals a gap between social appearance and reliable collective intelligence; and Deployment, where trustworthy use in robotics, healthcare, and scientific research depends on limiting agent freedom rather than expanding it. We also catalog OpenClaw benchmarks and outline future directions for treating constraints as core parts of open agent platform design.

  - title: "RAPTOR: Ridge-Adaptive Logistic Probes"
    id: raptor
    authors: Ziqi Gao, Yaotian Zhu, Qingcheng Zeng, Xu Zhao, <strong>Ziqing Wang</strong>, Feng Ruan, Kaize Ding
    conference_short: NeurIPS
    conference: Conference on Neural Information Processing Systems <strong>(NeurIPS)</strong>, 2026.
    year: 2026
    pdf: https://arxiv.org/pdf/2602.00158.pdf
    image: ./assets/img/RAPTOR.png
    tags: ["Agentic AI / LLMs"]
    abstract: >-
      Probing studies what information is encoded in a frozen LLM's layer representations by training a lightweight predictor on top of them. Beyond analysis, probes are often used operationally in probe-then-steer pipelines: a learned concept vector is extracted from a probe and injected via additive activation steering by adding it to a layer representation during the forward pass. The effectiveness of this pipeline hinges on estimating concept vectors that are accurate, directionally stable under ablation, and inexpensive to obtain. Motivated by these desiderata, we propose RAPTOR (Ridge-Adaptive Logistic Probe), a simple L2-regularized logistic probe whose validation-tuned ridge strength yields concept vectors from normalized weights. Across extensive experiments on instruction-tuned LLMs and human-written concept datasets, RAPTOR matches or exceeds strong baselines in accuracy while achieving competitive directional stability and substantially lower training cost; these quantitative results are supported by qualitative downstream steering demonstrations. Finally, using the Convex Gaussian Min-max Theorem (CGMT), we provide a mechanistic characterization of ridge logistic regression in an idealized Gaussian teacher-student model in the high-dimensional few-shot regime, explaining how penalty strength mediates probe accuracy and concept-vector stability and yielding structural predictions that qualitatively align with trends observed on real LLM embeddings.

  - title: "Can Post-Training Turn LLMs into Good Medical Coders? An Empirical Study of Generative ICD Coding"
    id: llm4icd
    authors: <strong>Ziqing Wang</strong>, Weihao Li, Shijie Chen, Yuan Luo, Kaize Ding
    conference_short: EMNLP
    conference: Findings of the Conference on Empirical Methods in Natural Language Processing <strong>(EMNLP)</strong>, 2026.
    year: 2026
    pdf: https://arxiv.org/pdf/2606.13940.pdf
    code: https://github.com/AlexandreWANG915/LLM4ICD
    image: ./assets/img/LLM4ICD.png
    tags: ["Agentic AI / LLMs", "AI for Science"]
    abstract: >-
      Automated International Classification of Diseases (ICD) coding is a core medical-coding task for billing, epidemiology, and clinical decision support. Generative large language models (LLMs) are often reported as weak medical coders, but this finding mainly comes from inference-time settings such as prompting, retrieval, reranking, or tool use, leaving the role of task-specific post-training underexplored. We present a controlled empirical study of post-training for generative ICD coding, comparing discriminative baselines with LLM coders across prompting, supervised fine-tuning, and reinforcement learning under a common protocol and metric set. To our knowledge, this is the first study to evaluate RL-based post-training for generative LLM coders in ICD coding. We further introduce PHI, a diagnostic curriculum that extends GRPO to refine missed-code cases. Our results show that prompting-only evaluation substantially underestimates the potential of LLMs for ICD coding. SFT provides the main capability jump, GRPO further improves code-set prediction beyond SFT, and PHI provides targeted gains on macro-level performance. These findings suggest that the main bottleneck is not the generative formulation alone, but how the model is adapted and optimized for full-taxonomy recall. We release our code, data splits, and checkpoints at https://github.com/AlexandreWANG915/LLM4ICD.

  - title: "MolMem: Memory-Augmented Agentic Reinforcement Learning for Sample-Efficient Molecular Optimization"
    id: molmem
    authors: <strong>Ziqing Wang</strong>, Yibo Wen, Abhishek Pandey, Han Liu, Kaize Ding
    conference_short: ACL
    conference: Annual Meeting of the Association for Computational Linguistics <strong>(ACL)</strong>, 2026.
    year: 2026
    pdf: https://arxiv.org/pdf/2604.12237.pdf
    code: https://github.com/REAL-Lab-NU/MolMem
    image: ./assets/img/MolMem.png
    tags: ["Agentic AI / LLMs", "AI for Science"]
    abstract: >-
      In drug discovery, molecular optimization aims to iteratively refine a lead compound to improve molecular properties while preserving structural similarity to the original molecule. However, each oracle evaluation is expensive, making sample efficiency a key challenge for existing methods under a limited oracle budget. Trial-and-error approaches require many oracle calls, while methods that leverage external knowledge tend to reuse familiar templates and struggle on challenging objectives. A key missing piece is long-term memory that can ground decisions and provide reusable insights for future optimizations. To address this, we present MolMem (\textbf{Mol}ecular optimization with \textbf{Mem}ory), a multi-turn agentic reinforcement learning (RL) framework with a dual-memory system. Specifically, MolMem uses Static Exemplar Memory to retrieve relevant exemplars for cold-start grounding, and Evolving Skill Memory to distill successful trajectories into reusable strategies. Built on this memory-augmented formulation, we train the policy with dense step-wise rewards, turning costly rollouts into long-term knowledge that improves future optimization. Extensive experiments show that MolMem achieves 90\% success on single-property tasks (1.5× over the best baseline) and 52\% on multi-property tasks using only 500 oracle calls. Our code is available at https://github.com/REAL-Lab-NU/MolMem.

  - title: "A Survey of Large Language Models for Text-Guided Molecular Discovery: from Molecule Generation to Optimization"
    id: llm4mol-survey
    authors: <strong>Ziqing Wang*</strong>, Kexin Zhang*, Zihan Zhao, Yibo Wen, Abhishek Pandey, Han Liu, Kaize Ding (*equal contribution)
    conference_short: ACL
    conference: Annual Meeting of the Association for Computational Linguistics <strong>(ACL)</strong>, 2026.
    year: 2026
    pdf: https://arxiv.org/pdf/2505.16094.pdf
    code: https://github.com/REAL-Lab-NU/Awesome-LLM-Centric-Molecular-Discovery
    image: ./assets/img/LLM4Molecule.jpg
    tags: ["Agentic AI / LLMs", "AI for Science"]
    abstract: >-
      Large language models (LLMs) are introducing a paradigm shift in molecular discovery by enabling text-guided interaction with chemical spaces through natural language, symbolic notations, with emerging extensions to incorporate multi-modal inputs. To advance the new field of LLM for molecular discovery, this survey provides an up-to-date and forward-looking review of the emerging use of LLMs for two central tasks: molecule generation and molecule optimization. Based on our proposed taxonomy for both problems, we analyze representative techniques in each category, highlighting how LLM capabilities are leveraged across different learning settings. In addition, we include the commonly used datasets and evaluation protocols. We conclude by discussing key challenges and future directions, positioning this survey as a resource for researchers working at the intersection of LLMs and molecular science. A continuously updated reading list is available at https://github.com/REAL-Lab-NU/Awesome-LLM-Centric-Molecular-Discovery.

  - title: "POLO: Preference-Guided Multi-Turn Reinforcement Learning for Lead Optimization"
    id: polo
    authors: <strong>Ziqing Wang</strong>, Yibo Wen, William Pattie, Xiao Luo, Weimin Wu, Jerry Yao-Chieh Hu, Abhishek Pandey, Han Liu, Kaize Ding
    conference_short: KDD
    conference: <b><font color="#cc0000">[Oral]</font></b> ACM SIGKDD Conference on Knowledge Discovery and Data Mining <strong>(KDD)</strong>, 2026.
    year: 2026
    pdf: https://arxiv.org/pdf/2509.21737.pdf
    image: ./assets/img/POLO.png
    tags: ["Agentic AI / LLMs", "AI for Science"]
    abstract: >-
      Lead optimization in drug discovery requires efficiently navigating vast chemical space through iterative cycles to enhance molecular properties while preserving structural similarity to the original lead compound. Despite recent advances, traditional optimization methods struggle with sample efficiency-achieving good optimization performance with limited oracle evaluations. Large Language Models (LLMs) provide a promising approach through their in-context learning and instruction following capabilities, which align naturally with these iterative processes. However, existing LLM-based methods fail to leverage this strength, treating each optimization step independently. To address this, we present POLO (Preference-guided multi-turn Optimization for Lead Optimization), which enables LLMs to learn from complete optimization trajectories rather than isolated steps. At its core, POLO introduces Preference-Guided Policy Optimization (PGPO), a novel reinforcement learning algorithm that extracts learning signals at two complementary levels: trajectory-level optimization reinforces successful strategies, while turn-level preference learning provides dense comparative feedback by ranking intermediate molecules within each trajectory. Through this dual-level learning from intermediate evaluation, POLO achieves superior sample efficiency by fully exploiting each costly oracle call. Extensive experiments demonstrate that POLO achieves 84% average success rate on single-property tasks (2.3x better than baselines) and 50% on multi-property tasks using only 500 oracle evaluations, significantly advancing the state-of-the-art in sample-efficient molecular optimization.

